name: LaTeX Lint & Build

# The fast lint job runs on every push. The heavy build job (installs texlive-full on the runner: several GB, ~10 minutes)
# is MANUAL ONLY: Actions -> "LaTeX Lint & Build" -> Run workflow. Papers are built locally (make build).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint LaTeX sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install chktex
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends chktex

      # Advisory: vendored packages must be pristine (checksums in _packages/vendor.lock).
      - name: Check vendored packages (advisory)
        continue-on-error: true
        run: python3 _scripts/vendor_check.py

      # Advisory: modern typography (accents → Unicode, curly quotes, no tabs)
      # via `make fashion`. Surfaces drift as an annotation; never gates.
      - name: Check typography (advisory)
        continue-on-error: true
        run: python3 _scripts/texfashion.py --check $(find . -name "*.tex" -not -path "./_*" -not -path "./.*")

      # Advisory: the project uses semantic wrapping (one sentence/clause per
      # line via `make wrap`). This surfaces drift as an annotation but does NOT
      # gate the pipeline — pre-existing prose must not block collaborators.
      - name: Check semantic wrapping (advisory)
        continue-on-error: true
        run: python3 _scripts/texwrap.py --check --cols 256 $(find . -name "*.tex" -not -path "./_*" -not -path "./.*")

      # Advisory: chktex flags style nits (non-breaking spaces, quote style, …)
      # that never prevent compilation, so it must not gate the build.
      - name: Run chktex (advisory)
        continue-on-error: true
        uses: j2kun/chktex-action@main
        with:
          args: "-q -l .chktexrc $(find . -name '*.tex' -not -path './_*' -not -path './.*')"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Hard gate: these genuinely harm output/portability.
      - name: Check for banned patterns
        run: |
          echo "Checking for banned patterns..."
          ERRORS=0
          TEX=$(find . -name "*.tex" -not -path "./_*" -not -path "./.*")
          if grep -n '\$\$' $TEX; then
            echo "ERROR: Double-dollar display math found. Use \\[...\\] or equation* instead."
            ERRORS=1
          fi
          if grep -n '\\begin{eqnarray' $TEX; then
            echo "ERROR: \\eqnarray found. Use align/align* instead."
            ERRORS=1
          fi
          [ "$ERRORS" -eq 0 ] && echo "All pattern checks passed."
          exit $ERRORS

  build:
    name: Build PDFs (manual only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            texlive-full \
            latexmk

      # Build every paper: each subdirectory (not starting with _ or .) holding
      # a main .tex (one with \documentclass). Run from inside the paper dir,
      # exactly as a user would.
      - name: Build all papers
        run: make build

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pdfs
          path: "*/*.pdf"
          retention-days: 14
